<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Zeitslot-Einteilung</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f6f7f9;--card:#fff;--tx:#1b1f24;--mu:#6a7380;--ac:#2f6fed;--bd:#dfe3e8;--ok:#1f9d55;--bad:#d93d3d;--okbg:#e6f6ec;--badbg:#fdecec}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171b;--card:#1d2127;--tx:#e8eaed;--mu:#97a0ad;--ac:#6d9bff;--bd:#2f353d;--ok:#4cc27d;--bad:#ff7070;--okbg:#17301f;--badbg:#3a1c1c}}
:root[data-theme="dark"]{--bg:#14171b;--card:#1d2127;--tx:#e8eaed;--mu:#97a0ad;--ac:#6d9bff;--bd:#2f353d;--ok:#4cc27d;--bad:#ff7070;--okbg:#17301f;--badbg:#3a1c1c}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,Segoe UI,sans-serif}
main{max-width:760px;margin:0 auto;padding:16px}
h1{font-size:1.4rem;margin:.2em 0 .8em}
h2{font-size:1.05rem;margin:0 0 .6em}
section{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input[type=text],input[type=number]{padding:9px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit;min-width:0}
input[type=text]{flex:1 1 140px}
input[type=number]{width:70px}
input.cp{width:56px;padding:2px 4px}
textarea{flex:1 1 200px;padding:9px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit;resize:vertical;min-width:0}
button{padding:9px 14px;border:0;border-radius:8px;background:var(--ac);color:#fff;font:inherit;cursor:pointer}
button.s{background:transparent;color:var(--mu);border:1px solid var(--bd);padding:6px 10px}
button.x{background:transparent;color:var(--bad);padding:2px 8px;font-size:1.1rem}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.chip{display:flex;align-items:center;gap:4px;border:1px solid var(--bd);border-radius:999px;padding:3px 4px 3px 12px;font-size:.92rem}
.chip small{color:var(--mu)}
.sc{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th,td{padding:6px 8px;text-align:center;border-bottom:1px solid var(--bd);white-space:nowrap}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--card)}
th{font-size:.85rem;color:var(--mu);font-weight:600}
td input{width:20px;height:20px;accent-color:var(--ac)}
.res{display:grid;gap:10px}
.box{border:1px solid var(--bd);border-radius:10px;padding:10px 12px}
.box.bad{background:var(--badbg);border-color:var(--bad)}
.box.ok{background:var(--okbg)}
.box b{display:block;margin-bottom:4px}
.mu{color:var(--mu);font-size:.9rem}
.empty{color:var(--mu);font-style:italic}
.pc{display:inline-block;margin:3px 6px 3px 0;padding:6px 12px;border:1px solid var(--bd);border-radius:999px;background:var(--bg);cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.pc.lift{opacity:.35}
.pc.ghost{position:fixed;z-index:99;pointer-events:none;margin:0;box-shadow:0 4px 14px rgba(0,0,0,.3);transform:translate(-50%,-130%)}
.zone{transition:background .12s,border-color .12s}
.dragging .zone.can{background:var(--okbg);border-color:var(--ok);box-shadow:0 0 10px var(--ok)}
.dragging .zone.hov{outline:2px solid var(--ac)}
.over{color:var(--bad);font-weight:700}
input[type=time]{padding:9px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
.chip{flex-wrap:wrap;border-radius:12px;padding:6px 8px}
.chip input{padding:3px 4px;font-size:.9rem}
.chip input[type=time]{width:96px}
.pr{display:flex;gap:10px;width:100%;margin:4px 0;border-radius:10px}
.t{color:var(--mu);font-variant-numeric:tabular-nums;white-space:nowrap}
.pr.ib{box-shadow:0 -3px 0 var(--ac)}
.zone.ie .pr:last-of-type{box-shadow:0 3px 0 var(--ac)}
@media print{
:root:root:root{--bg:#fff;--card:#fff;--tx:#000;--mu:#555;--bd:#bbb;--okbg:#fff;--badbg:#fff;--ok:#000;--bad:#000}
body{background:#fff}
.row,main>section:not(:last-of-type){display:none}
main>section:last-of-type{border:0;padding:0}
.box{break-inside:avoid}
}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>
<main>
<h1>Zeitslot-Einteilung</h1>

<section>
<h2>1. Zeitslots</h2>
<div class="row">
<input type="text" id="sn" placeholder="Tag/Name, z. B. Montag"><input type="time" id="st" value="14:00" title="Beginn"><input type="time" id="en" value="15:00" title="Ende">
<input type="number" id="sc" min="1" value="4" title="Plätze">
<button id="sa">Hinzufügen</button>
</div>
<div class="mu" style="margin-top:6px">Reihenfolge: Name, von, bis, Plätze. Dauer pro Gespräch = Slotlänge ÷ Plätze, pro Slot änderbar (Feld „Min.“ leer = automatisch).</div>
<div class="chips" id="sl"></div>
</section>

<section>
<h2>2. Personen &amp; Verfügbarkeit</h2>
<div class="row">
<textarea id="pn" rows="4" placeholder="Namen eintragen: einer pro Zeile oder mit Komma getrennt"></textarea>
<button id="pa">Hinzufügen</button>
</div>
<div class="sc" style="margin-top:10px" id="mx"></div>
</section>

<section>
<div class="row">
<button id="go">Einteilen</button>
<button class="s" id="sh">Neu mischen</button>
<button class="s" id="cp">Ergebnis kopieren</button>
<button class="s" id="pd">Als PDF speichern</button>
<button class="s" id="rs">Alles löschen</button>
</div>
<div class="res" id="out" style="margin-top:12px"></div>
</section>
</main>

<script>
var S={slots:[],persons:[]},R=null,uid=1;
try{var d=JSON.parse(localStorage.getItem('zs')||'null');if(d&&d.slots&&d.persons){S=d;uid=Math.max(1,...S.slots.map(function(x){return x.id}),...S.persons.map(function(x){return x.id}))+1}}catch(e){}
function save(){try{localStorage.setItem('zs',JSON.stringify(S));localStorage.setItem('zr',JSON.stringify(R?{u:R.un.map(function(p){return p.id}),a:Object.keys(R.asg).reduce(function(o,k){o[k]=R.asg[k].map(function(p){return p.id});return o},{})}:null))}catch(e){}}
function $(i){return document.getElementById(i)}
function esc(t){return String(t).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}

function render(){
 $('sl').innerHTML=S.slots.length?S.slots.map(function(s){return '<span class="chip">'+esc(s.name)+' <input type="time" data-st="'+s.id+'" value="'+tm(s.start)+'"> – <input type="time" data-en="'+s.id+'" value="'+tm(s.end)+'"> <input type="number" min="1" class="cp" data-cs="'+s.id+'" value="'+s.cap+'" title="Plätze"> Pl. <input type="number" min="1" class="cp" data-du="'+s.id+'" value="'+(s.dur||'')+'" placeholder="'+dur(s)+'" title="Minuten pro Gespräch"> Min.<button class="x" data-ds="'+s.id+'">×</button></span>'}).join(''):'<span class="empty">Noch keine Slots</span>';
 if(!S.persons.length||!S.slots.length){$('mx').innerHTML='<span class="empty">Lege Slots und Personen an, dann erscheint hier die Tabelle.</span>';return}
 var h='<table><tr><th>Person</th>'+S.slots.map(function(s){return '<th>'+esc(s.name)+'</th>'}).join('')+'<th></th></tr>';
 S.persons.forEach(function(p){
  h+='<tr><td>'+esc(p.name)+'</td>'+S.slots.map(function(s){return '<td><input type="checkbox" data-p="'+p.id+'" data-s="'+s.id+'"'+(p.av.indexOf(s.id)>-1?' checked':'')+'></td>'}).join('')+'<td><button class="x" data-dp="'+p.id+'">×</button></td></tr>'});
 $('mx').innerHTML=h+'</table>';
}

function addSlot(){var n=$('sn').value.trim();if(!n)return;var a=pm($('st').value,840),b=pm($('en').value,a+60);if(b<=a){alert('Das Ende muss nach dem Beginn liegen.');return}S.slots.push({id:uid++,name:n,start:a,end:b,dur:0,cap:Math.max(1,parseInt($('sc').value)||1)});$('sn').value='';$('sc').value=4;R=null;save();render();out()}
function addPerson(){var ns=$('pn').value.split(/[\n,;]+/).map(function(x){return x.trim()}).filter(Boolean);if(!ns.length)return;ns.forEach(function(n){S.persons.push({id:uid++,name:n,av:[]})});$('pn').value='';R=null;save();render();out()}
$('sa').onclick=addSlot;$('pa').onclick=addPerson;
$('sn').onkeydown=function(e){if(e.key==='Enter')addSlot()};
$('pn').onkeydown=function(e){if(e.key==='Enter'&&(e.ctrlKey||e.metaKey))addPerson()};

document.addEventListener('click',function(e){
 var t=e.target;
 if(t.dataset.ds){var id=+t.dataset.ds;S.slots=S.slots.filter(function(s){return s.id!==id});S.persons.forEach(function(p){p.av=p.av.filter(function(x){return x!==id})});R=null;save();render();out()}
 if(t.dataset.dp){var pid=+t.dataset.dp;S.persons=S.persons.filter(function(p){return p.id!==pid});R=null;save();render();out()}
});
document.addEventListener('change',function(e){
 var t=e.target;if(t.dataset.st||t.dataset.en||t.dataset.du){var sx=S.slots.filter(function(x){return x.id==(t.dataset.st||t.dataset.en||t.dataset.du)})[0];if(t.dataset.st)sx.start=pm(t.value,sx.start);if(t.dataset.en)sx.end=pm(t.value,sx.end);if(t.dataset.du)sx.dur=Math.max(0,parseInt(t.value)||0);save();render();out();return}if(t.dataset.cs){var sl=S.slots.filter(function(x){return x.id==t.dataset.cs})[0];sl.cap=Math.max(1,parseInt(t.value)||1);R=null;save();render();out();return}if(t.dataset.p===undefined)return;
 var p=S.persons.filter(function(x){return x.id==t.dataset.p})[0],s=+t.dataset.s;
 p.av=p.av.filter(function(x){return x!==s});if(t.checked)p.av.push(s);
 R=null;save();out()});

function shuf(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}

function solve(){
 var cap={},asg={};
 S.slots.forEach(function(s){cap[s.id]=s.cap;asg[s.id]=[]});
 function tryP(p,vis){
  var opts=shuf(p.av.filter(function(x){return cap[x]!==undefined}));
  for(var i=0;i<opts.length;i++){
   var s=opts[i];if(vis[s])continue;vis[s]=1;
   if(asg[s].length<cap[s]){asg[s].push(p);return true}
   for(var k=0;k<asg[s].length;k++){if(tryP(asg[s][k],vis)){asg[s][k]=p;return true}}
  }
  return false;
 }
 var un=[];
 shuf(S.persons).forEach(function(p){if(!tryP(p,{}))un.push(p)});
 R={asg:asg,un:un};save();
}

function outOld(){
 var o=$('out');
 if(!R){o.innerHTML='<span class="empty">Noch keine Einteilung berechnet.</span>';return}
 var h='';
 if(R.un.length){
  h+='<div class="box bad"><b>Nicht einteilbar ('+R.un.length+')</b>'+R.un.map(function(p){return esc(p.name)+(p.av.length?'':' <span class="mu">(keine Zeit angegeben)</span>')}).join(', ')+'<div class="mu" style="margin-top:6px">Alle Slots, in denen diese Personen Zeit haben, sind sonst nicht ausreichend besetzbar. Mehr Plätze oder weitere Verfügbarkeiten würden helfen.</div></div>';
 }else if(S.persons.length){
  h+='<div class="box ok"><b>Alle '+S.persons.length+' Personen eingeteilt ✓</b></div>';
 }
 S.slots.forEach(function(s){
  var l=R.asg[s.id];
  h+='<div class="box"><b>'+esc(s.name)+' <span class="mu">('+l.length+'/'+s.cap+')</span></b>'+(l.length?l.map(function(p){return esc(p.name)}).join(', '):'<span class="empty">frei</span>')+'</div>';
 });
 o.innerHTML=h;
}

$('go').onclick=function(){solve();out()};
$('sh').onclick=function(){solve();out()};
$('cp').onclick=function(){
 if(!R)return;
 var t=S.slots.map(function(s){return slotLabel(s)+'\n'+(R.asg[s.id].map(function(p,i){return '  '+rng(s,i)+' '+p.name}).join('\n')||'  -')}).join('\n\n');
 if(R.un.length)t+='\nNicht eingeteilt: '+R.un.map(function(p){return p.name}).join(', ');
 try{navigator.clipboard.writeText(t)}catch(e){}
};
$('pd').onclick=pdf;
$('rs').onclick=function(){if(confirm('Wirklich alle Slots und Personen löschen?')){S={slots:[],persons:[]};R=null;save();render();out()}};

function pdf(){
 if(!R){solve();out()}
 if(!window.jspdf){window.print();return}
 var d=new window.jspdf.jsPDF(),y=20,M=18;
 function ln(t,sz,b,g){d.setFont('helvetica',b?'bold':'normal');d.setFontSize(sz);if(y>280){d.addPage();y=20}d.text(String(t),M,y);y+=g}
 ln('Zeitslot-Einteilung',18,1,10);
 S.slots.forEach(function(s){var l=R.asg[s.id];y+=3;ln(s.name+'  '+tm(s.start)+' - '+tm(s.end)+' Uhr',13,1,7);if(!l.length)ln('-',11,0,6);l.forEach(function(p,i){var a=s.start+i*dur(s);ln(tm(a)+' - '+tm(a+dur(s))+'   '+p.name,11,0,6)})});
 if(R.un.length){y+=3;ln('Nicht eingeteilt',13,1,7);R.un.forEach(function(p){ln('- '+p.name,11,0,6)})}
 d.save('Zeitslot-Einteilung.pdf');
}

function pc(p){return '<span class="pc" data-pid="'+p.id+'">'+esc(p.name)+'</span>'}
function out(){
 var o=$('out');
 if(!R){o.innerHTML='<span class="empty">Noch keine Einteilung berechnet.</span>';return}
 var h='<div class="mu">Namen ziehen und ablegen: grün leuchtet, wo die Person Zeit hat. Die Reihenfolge im Slot bestimmt die Uhrzeit.</div>';
 if(S.persons.length)h+='<div class="box zone '+(R.un.length?'bad':'ok')+'" data-z="un"><b>'+(R.un.length?'Nicht eingeteilt ('+R.un.length+')':'Alle '+S.persons.length+' Personen eingeteilt ✓')+'</b>'+R.un.map(pc).join('')+'</div>';
 S.slots.forEach(function(s){var l=R.asg[s.id];h+='<div class="box zone" data-z="'+s.id+'"><b>'+esc(s.name)+' '+tm(s.start)+'–'+tm(s.end)+' <span class="mu'+(l.length>s.cap?' over':'')+'">('+l.length+'/'+s.cap+')</span></b>'+(l.length?l.map(function(p,i){var a=s.start+i*dur(s);return '<div class="pc pr" data-pid="'+p.id+'"><span class="t'+(a+dur(s)>s.end?' over':'')+'">'+tm(a)+'–'+tm(a+dur(s))+'</span>'+esc(p.name)+'</div>'}).join(''):'<span class="empty">frei</span>')+'</div>'});
 o.innerHTML=h;
}

function moveTo(p,z,ix){
 R.un=R.un.filter(function(x){return x.id!==p.id});
 Object.keys(R.asg).forEach(function(k){R.asg[k]=R.asg[k].filter(function(x){return x.id!==p.id})});
 if(z!=='un'&&R.asg[z]){var L=R.asg[z];L.splice(ix==null?L.length:Math.min(ix,L.length),0,p)}else R.un.push(p);
 save();out();
}

var dg=null,dt=0;
function zoneAt(x,y){var el=document.elementFromPoint(x,y);return el&&el.closest?el.closest('.zone'):null}
function dmove(e){
 if(!dg)return;dg.x=e.clientX;dg.y=e.clientY;
 dg.g.style.left=dg.x+'px';dg.g.style.top=dg.y+'px';
 document.querySelectorAll('.zone.hov').forEach(function(n){n.classList.remove('hov')});
 document.querySelectorAll('.ib,.ie').forEach(function(n){n.classList.remove('ib','ie')});
 var z=zoneAt(dg.x,dg.y);dg.idx=null;
 if(z){z.classList.add('hov');
  if(z.dataset.z!=='un'){var rs=[].filter.call(z.querySelectorAll('.pr'),function(n){return +n.dataset.pid!==dg.p.id}),i=0;
   rs.forEach(function(n){var b=n.getBoundingClientRect();if(b.top+b.height/2<dg.y)i++});
   dg.idx=i;if(i<rs.length)rs[i].classList.add('ib');else z.classList.add('ie')}}
}
function dend(e,drop){
 if(!dg)return;
 var z=drop?zoneAt(e.clientX,e.clientY):null,p=dg.p,ix=dg.idx;
 clearInterval(dt);dg.g.remove();document.body.classList.remove('dragging');dg=null;
 if(z)moveTo(p,z.dataset.z,ix);else out();
}
$('out').addEventListener('pointerdown',function(e){
 var c=e.target.closest('.pc');if(!c||dg)return;
 e.preventDefault();
 var pid=+c.dataset.pid,p=S.persons.filter(function(x){return x.id===pid})[0];if(!p)return;
 var g=c.cloneNode(true);g.className='pc ghost';document.body.appendChild(g);
 c.classList.add('lift');document.body.classList.add('dragging');
 document.querySelectorAll('.zone').forEach(function(z){if(p.av.indexOf(+z.dataset.z)>-1)z.classList.add('can')});
 dg={p:p,g:g};dmove(e);
 dt=setInterval(function(){if(!dg)return;if(dg.y<70)window.scrollBy(0,-14);else if(dg.y>innerHeight-70)window.scrollBy(0,14)},16);
});
window.addEventListener('pointermove',function(e){if(dg){e.preventDefault();dmove(e)}},{passive:false});
window.addEventListener('pointerup',function(e){dend(e,true)});
window.addEventListener('pointercancel',function(e){dend(e,false)});

function loadR(){try{var r=JSON.parse(localStorage.getItem('zr')||'null');if(!r)return;var by={},put={};S.persons.forEach(function(p){by[p.id]=p});R={asg:{},un:[]};
 function take(ids,t){(ids||[]).forEach(function(i){if(by[i]&&!put[i]){put[i]=1;t.push(by[i])}})}
 S.slots.forEach(function(s){R.asg[s.id]=[];take((r.a||{})[s.id],R.asg[s.id])});
 take(r.u,R.un);take(S.persons.map(function(p){return p.id}),R.un)}catch(e){R=null}}

function tm(m){m=Math.max(0,m|0);return ('0'+Math.floor(m/60)%24).slice(-2)+':'+('0'+m%60).slice(-2)}
function pm(v,f){var m=/^(\d{1,2}):(\d{2})/.exec(v||'');return m?(+m[1])*60+(+m[2]):f}
function dur(s){return s.dur>0?s.dur:Math.max(1,Math.floor((s.end-s.start)/s.cap))}
function rng(s,i){var a=s.start+i*dur(s);return tm(a)+'–'+tm(a+dur(s))}
function slotLabel(s){return s.name+' '+tm(s.start)+'–'+tm(s.end)}
function migrate(){S.slots.forEach(function(s){
 if(typeof s.start==='number')return;
 var m=/(\d{1,2})(?::(\d{2}))?\s*(?:-|–|bis)\s*(\d{1,2})(?::(\d{2}))?/.exec(s.name);
 if(m){s.start=(+m[1])*60+(+(m[2]||0));s.end=(+m[3])*60+(+(m[4]||0));var n=s.name.replace(m[0],'').replace(/\s*Uhr\s*$/i,'').trim();if(n)s.name=n}
 else{s.start=840;s.end=900}
 if(s.end<=s.start)s.end=s.start+60;
 s.dur=s.dur||0;
});save()}

loadR();migrate();render();out();
</script>
</body>
</html>
